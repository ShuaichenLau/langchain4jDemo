#ollama
langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=deepseek-r1:1.5b
langchain4j.ollama.chat-model.temperature=0.8
langchain4j.ollama.chat-model.timeout=PT60S

#应用程序发送给大模型的请求日志和响应日志
langchain4j.ollama.chat-model.log-requests=true
langchain4j.ollama.chat-model.log-responses=true


#阿里百炼平台
langchain4j.community.dashscope.chat-model.api-key=sk-0ee8c7f6e1034cbe9f948fe80586146e
#langchain4j.community.dashscope.chat-model.model-name=deepseek-r1
langchain4j.community.dashscope.chat-model.model-name=qwen-max


#阿里百炼平台——应用程序发送给大模型的请求日志和响应日志
langchain4j.community.dashscope.chat-model.log-requests=true
langchain4j.community.dashscope.chat-model.log-responses=true

#温度系数：取值范围通常在 0 到 1 之间。值越高，模型的输出越随机、富有创造性；
# 值越低，输出越确定、保守。这里设置为 0.9，意味着模型会有一定的随机性，生成的回复可能会比较多样化。
langchain4j.open-ai.chat-model.temperature=0.9


#MongoDB连接配置
spring.data.mongodb.uri=mongodb://admin:admin@192.168.3.6:27017/admin

# 基本数据源配置
spring.datasource.url=jdbc:mysql://192.168.3.6:3306/guiguxiaozhi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 开启 SQL 日志打印
